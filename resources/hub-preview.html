<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hub page preview – MapMaker resource pages (lab)</title>
<style>
  body{margin:0;background:#fff;color:#111;font-family:"Avenir Next",Avenir,"Segoe UI",Helvetica,Arial,sans-serif}
  .skip{position:absolute;left:8px;top:-60px;background:#FFCC00;color:#000;padding:8px 12px;z-index:100;font-weight:700}
  .skip:focus{top:8px}
  .lab{background:#fff6dc;color:#4a3a06;border-bottom:1px solid #e8d38a;font-size:.92rem;padding:.55rem 16px}
  .lab a{color:#0a4fa8}
  .hubbar{background:#fff;border-bottom:1px solid #d6d6d0;padding:.8rem 16px;display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;align-items:center}
  .hubbar .name{font-size:1.3rem;font-weight:600;color:#111;text-decoration:none}
  .hubbar ul{display:flex;gap:1.2rem;list-style:none;margin:0;padding:0}
  .hubbar a{color:#111}
  main{padding:16px}
  .hubsection{margin:0 0 24px}
  :focus-visible{outline:3px solid #0b5fff;outline-offset:2px}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to the page</a>
<aside class="lab" aria-label="About this preview"><strong>Hub page preview.</strong> Each block below is one Hub text card, built from the same layout the publishing notebook sends to Hub. On Hub, the site's own header and footer replace the bar below. <a href="./">Lab mock-up</a></aside>
<header class="hubbar" aria-label="Site header (simulated)">
  <a class="name" id="site-name" href="hub-preview.html?page=lessons">MapMaker Lessons</a>
  <nav aria-label="Site"><ul><li><a href="hub-preview.html?page=lessons">Lessons</a></li></ul></nav>
</header>
<main id="main" tabindex="-1"><p>Loading…</p></main>
<script src="assets/lesson-core.js"></script>
<script src="assets/hub-page.js"></script>
<script>
(function () {
  "use strict";
  function getJSON(u) { return fetch(u, { cache: "no-cache" }).then(function (r) { if (!r.ok) throw new Error(u + " (" + r.status + ")"); return r.json(); }); }
  var main = document.getElementById("main");
  getJSON("site.json").then(function (site) {
    return getJSON("lessons/index.json").then(function (idx) {
      return Promise.all(idx.lessons.map(function (id) { return getJSON("lessons/" + id + ".json"); }));
    }).then(function (lessons) {
      var b = MMRHub.bundle(site, lessons);
      var want = new URLSearchParams(location.search).get("page") || b.hub.lessonsSlug;
      var page = b.pages.filter(function (p) { return p.slug === want; })[0];
      if (!page) { main.innerHTML = "<h1>No such page</h1><p><a href=\"hub-preview.html\">See the lessons</a></p>"; return; }
      document.title = page.title + " – Hub page preview";
      var sheets = {}; b.sheets.forEach(function (s) { sheets[s.key] = "dist/sheets/" + s.fileName; });
      main.innerHTML = page.layout.sections.map(function (sec) {
        var md = sec.rows[0].cards[0].component.settings.markdown
          .replace(/\{\{SHEET:([^}]+)\}\}/g, function (_, k) { return sheets[k] || "#"; })
          .replace(/href="\/pages\/([a-z0-9-]+)"/g, 'href="hub-preview.html?page=$1"');
        return '<div class="hubsection">' + md + "</div>";
      }).join("");
    });
  }).catch(function (e) { main.innerHTML = "<h1>This preview couldn't load</h1><p>" + MMR.esc(e.message) + "</p>"; });
})();
</script>
</body>
</html>
