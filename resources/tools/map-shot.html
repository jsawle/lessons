<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map picture</title>
<!-- Draws one public web map at its opening view, with no app around it, for the map pictures on the lesson pages.
     Open as map-shot.html?webmap=<item id>. map-screenshots.mjs (run by the Map pictures workflow on GitHub) waits for
     window.__mapStatus.state to be "ready" or "error", then takes the picture. The attribution line stays visible. -->
<link rel="stylesheet" href="https://js.arcgis.com/4.34/esri/themes/light/main.css">
<style>html,body,#view{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#fff}</style>
<script src="https://js.arcgis.com/4.34/"></script>
</head>
<body>
<div id="view"></div>
<script>
window.__mapStatus = { state: "loading" };
require(["esri/WebMap", "esri/views/MapView", "esri/core/reactiveUtils"], function (WebMap, MapView, reactiveUtils) {
  var id = new URLSearchParams(location.search).get("webmap") || "";
  if (!/^[0-9a-f]{32}$/i.test(id)) { window.__mapStatus = { state: "error", message: "No web map id" }; return; }
  var map = new WebMap({ portalItem: { id: id, portal: { url: "https://www.arcgis.com" } } });
  var view = new MapView({ container: "view", map: map, ui: { components: ["attribution"] } });
  view.when(function () {
    return reactiveUtils.whenOnce(function () { return !view.updating; });
  }).then(function () {
    // A short pause so labels and the last tiles finish drawing.
    setTimeout(function () {
      var layers = [];
      map.allLayers.forEach(function (l) {
        layers.push({ title: l.title, type: l.type, visible: l.visible, loadStatus: l.loadStatus,
          error: l.loadError ? String(l.loadError.message || l.loadError) : null });
      });
      window.__mapStatus = { state: "ready", title: map.portalItem && map.portalItem.title, layers: layers };
    }, 2500);
  }).catch(function (e) {
    window.__mapStatus = { state: "error", message: String((e && e.message) || e) };
  });
});
</script>
</body>
</html>
