name: Check and build lesson files

# On every change to the lesson pages: check every lesson file and the Hub pages built from them,
# then build resources/dist (Hub bundle, Word sheets, knowledge file) for every lessons settings file.
# On main, the built files are committed back so GitHub Pages serves them to the publishing notebook.

on:
  push:
    paths:
      - "resources/**"
      - "!resources/dist/**"
      - ".github/workflows/resources-check.yml"
  pull_request:
    paths:
      - "resources/**"
      - ".github/workflows/resources-check.yml"

permissions:
  contents: write

concurrency:
  group: resources-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every lesson file and its Hub page
        run: node resources/tools/validate.mjs
      - name: Build Hub bundles, Word sheets and knowledge files (every lessons settings file)
        run: |
          npm install --no-save docx@9.7.1
          node resources/tools/build-dist.mjs --all
      - name: Keep the built files as a download
        uses: actions/upload-artifact@v4
        with:
          name: lesson-dist
          path: resources/dist
      - name: Commit the built files (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/dist
          if git diff --cached --quiet; then
            echo "resources/dist is already up to date."
          else
            git commit -m "Rebuild resources/dist from the lesson files [skip ci]"
            git push
          fi
